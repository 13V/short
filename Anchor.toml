# Anchor workspace config for the on-chain program.
#
# The Rust `core` crate is tested via plain `cargo test` (see root Cargo.toml).
# This file drives `anchor build` / `anchor test` for `programs/short-perp`,
# which requires the Solana + Anchor toolchain installed locally.

[toolchain]
anchor_version = "0.31.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
short_perp = "Short111111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
